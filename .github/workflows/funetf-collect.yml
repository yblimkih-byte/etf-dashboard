# v38 FunETF 구성종목 자동 수집 — 화·금 KST 02:00 시작, 05:50 이후 새 요청 없음(PC 꺼져 있어도 됨)
#  · FunETF 공개 구성종목 PDF 를 ETF 1건씩, 응답 뒤 10초 쉬고 받아 Apps Script 웹앱(doPost)으로 반영 — scripts/funetf_collect.mjs
#  · 사전 준비(1회): 저장소 Settings › Secrets and variables › Actions › New repository secret
#      Name = FUN_IMPORT_TOKEN, Secret = 스프레드시트 '구성종목_버튼' 시트 A5 값(메뉴 '구성종목 수집 버튼(FunETF) 만들기'로 생성)
#  · 예약 시각은 UTC: 월·목 16:41 = KST 화·금 01:41(정각 혼잡을 피해 일찍 깨고, 스크립트가 02:00 까지 기다림)
#  · 수동 실행: Actions › 이 작업 › Run workflow (시험: limit 에 5 처럼 적으면 앞 5종목만 새로 받고 나머지는 이전 자료 유지)
#  · 공개 저장소의 예약 작업은 저장소 활동이 60일 없으면 GitHub 가 자동으로 끔 → Actions 화면에서 다시 켜기(Enable workflow)
name: FunETF 구성종목 자동 수집
on:
  schedule:
    - cron: '41 16 * * 1,4'
  workflow_dispatch:
    inputs:
      limit:
        description: '시험용: 앞에서 N종목만 새로 받기(0 = 전체)'
        default: '0'
      now:
        description: '02:00 까지 기다리지 않고 바로 시작(마감 = 시작 + 3시간 50분)'
        type: boolean
        default: false
concurrency:
  group: funetf-collect
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: FunETF → 스프레드시트 반영
        run: node scripts/funetf_collect.mjs
        env:
          FUN_IMPORT_TOKEN: ${{ secrets.FUN_IMPORT_TOKEN }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          NOW: ${{ github.event.inputs.now == 'true' && '1' || '0' }}
