<style>
/* ── Cohere-style tokens: white canvas, near-black ink, hairlines, pill controls ── */
:root{
  --ink:#212121; --ink-2:#75758a; --muted:#93939f; --black:#17171c;
  --rule:#d9d9dd; --rule-2:#e5e7eb; --stone:#eeece7; --canvas:#ffffff;
  --blue:#1863dc; --coral:#ff7759; --coral-soft:#ffad9b;
  --r-sm:8px; --r-md:16px; --r-lg:22px; --r-pill:32px;
  --font:'Inter','Noto Sans KR',Arial,ui-sans-serif,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
main{max-width:1280px;margin:0 auto;padding:0 32px 64px}
.hdr-wrap{position:sticky;top:0;z-index:20;background:var(--canvas);box-shadow:0 1px 0 var(--rule-2)}
.hdr{max-width:1280px;margin:0 auto;padding:18px 32px 0}
.hdr-row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.display{font-size:34px;line-height:1;letter-spacing:-1px;font-weight:400;margin:4px 0 0}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.28px;text-transform:uppercase;color:var(--ink-2)}
.hdr-meta{text-align:right;line-height:1.6}
.use-note{font-size:11px;color:var(--ink-2);text-transform:none;letter-spacing:0;margin-top:2px}.use-note a{color:var(--blue)}
.hdr-meta .ld-note{display:inline-block;max-width:640px;white-space:normal;font-size:12px}.hdr-meta .ld-note.warn{color:#b45309}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 4px}
.tab{border:1px solid var(--black);background:transparent;color:var(--black);border-radius:30px;padding:8px 18px;font:500 14px/1.4 var(--font);cursor:pointer}
.tab:hover{background:var(--stone)}
.tab.active{background:var(--black);color:#fff}
.controls{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;padding:10px 0 14px;min-height:44px}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl label{font-family:var(--mono);font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-2)}
.ctl select,.ctl input{font:14px var(--font);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;background:#fff;min-width:150px}
.ctl select:focus,.ctl input:focus{outline:2px solid #4c6ee6;outline-offset:1px}
.seg{display:flex;border:1px solid var(--black);border-radius:30px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;font:14px var(--font);cursor:pointer;color:var(--black)}
.seg button.on{background:var(--black);color:#fff}
.btn{border:0;background:var(--black);color:#fff;border-radius:var(--r-pill);padding:10px 22px;font:500 14px var(--font);cursor:pointer}
.btn.ghost{background:transparent;color:var(--black);border:1px solid var(--black)}
.view{padding-top:28px}
.loading,.error,.empty{padding:48px 0;color:var(--ink-2);text-align:center}
.error{color:#b30000}
.section{padding:28px 0;border-bottom:1px solid var(--rule-2)}
.section:last-child{border-bottom:0}
.section-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;margin-bottom:16px}
body:not(.web) .section-h .h2{flex:none;max-width:100%}body:not(.web) .section-h .note{flex:1 1 300px;min-width:0}   /* v41: 설명이 길어도 제목은 줄바꿈하지 않음(설명이 아래 줄로). 웹은 제목·설명이 위아래(세로 배치)라 제외 */
.h2{font-size:24px;line-height:1.3;font-weight:400;margin:0;letter-spacing:-.2px}
.h3{font-size:16px;font-weight:500;margin:0 0 10px}
.note{font-size:13px;color:var(--ink-2)}
.note-lines{line-height:1.6;word-break:keep-all}.note-lines .nl{display:block}.note-lines .nl+.nl{margin-top:1px}.note-lines b{font-weight:600;color:var(--ink)}.note-lines .nh{display:block;font-weight:600;color:var(--ink);margin:8px 0 1px}   /* v44: 설명은 한 줄에 하나씩 */
.kv td .nl{display:block}.kv td .nl+.nl{margin-top:2px}
.grid{display:grid;gap:24px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid-6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1024px){.grid-3,.grid-4,.grid-6{grid-template-columns:repeat(2,minmax(0,1fr))}.display{font-size:28px}}
@media (max-width:640px){.grid-2,.grid-3,.grid-4,.grid-6{grid-template-columns:1fr}main,.hdr{padding-left:16px;padding-right:16px}}
.tile{border-top:1px solid var(--rule);padding:14px 0 4px}
.tile .k{font-family:var(--mono);font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-2)}
.tile .v{font-size:28px;line-height:1.2;letter-spacing:-.4px;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .d{font-size:13px;color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}
.card{border:1px solid var(--rule);border-radius:var(--r-sm);padding:20px}
.chart-wrap{position:relative;height:320px}
.chart-wrap.tall{height:460px}
.chart-wrap.short{height:240px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-family:var(--mono);font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-2);font-weight:400;text-align:right;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;line-height:16px}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--rule-2);text-align:right;white-space:nowrap;line-height:20px}   /* v21: 행 높이를 정수(px)로 고정 — 소수 line-height 때문에 확대 배율에서 행 간격이 1px씩 달라 보이던 현상 제거 */
.tbl th:first-child,.tbl td:first-child,.tbl .l{text-align:left}
.tbl tr.total td{border-top:1px solid var(--rule);font-weight:500}
.tbl-scroll{overflow-x:auto}
.neg{color:#b30000}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:-1px}
.chip{display:inline-block;border:1px solid var(--coral-soft);color:var(--ink);border-radius:8px;padding:1px 8px;font-size:12px;margin-left:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2);margin:6px 0 10px}
.race-bar{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.race-bar input[type=range]{flex:1}
.race-ym{font-size:28px;letter-spacing:-.4px;min-width:110px;font-variant-numeric:tabular-nums}
/* v18: 상위 N 내 운용사 M/S 한 줄 막대 (슬라이더와 차트 사이) */
.race-ms{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.race-ms-l{font-size:12px;color:var(--ink-2);white-space:nowrap;min-width:156px}
.race-ms+.race-ms{margin-top:-6px}   /* v24: 운용사별·유형별 두 줄 */
.race-note{font-size:12px;margin:-6px 0 14px;line-height:1.5}   /* v26: 유형 분류 주석(유형별 M/S 막대 아래) */
.ms-drv{margin:2px 0 8px}   /* v26: M/S 변동 주요 유형 */
.race-ms-bar{flex:1;display:flex;gap:2px;height:24px;min-width:0}
.race-ms-seg{flex:0 1 0;min-width:0;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;line-height:24px;padding:0 6px;font-variant-numeric:tabular-nums;cursor:default}
.sub-h{font-size:14px;font-weight:600;margin:18px 0 8px}
.ftr{max-width:1280px;margin:0 auto;padding:24px 32px 40px;border-top:1px solid var(--rule);text-transform:none;letter-spacing:0}
.tbl tbody tr:hover td{background:#fafaf8}
/* 그룹 헤더(연초 대비 / 전월 대비 …): 관련 열을 묶어 보이게 */
.tbl tr.grp-row th{border-bottom:0;padding-bottom:2px}
.tbl th.grp{text-align:center;color:var(--ink);border-bottom:1px solid var(--rule)}
.tbl th.nog{border-bottom:0}
.tbl .g-start{border-left:1px solid var(--rule-2);padding-left:14px}
.tbl .g-end{padding-right:14px}
.tbl th.g-in{color:var(--ink-2)}
/* 운용사 선택 칩 */
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0 14px}
.chips-hint{font-size:12px;color:var(--ink-2);margin-right:6px}
.chip-m{display:inline-flex;align-items:center;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:30px;padding:6px 14px 6px 10px;font:500 13px/1.2 var(--font);cursor:pointer;transition:all .15s}
.chip-m:hover{border-color:var(--black)}
.chip-m.on{background:var(--black);color:#fff;border-color:var(--black)}
.chip-m.off{opacity:.45}
.chip-m.reset{border-style:dashed;padding-left:14px}
.chart-wrap.xtall{height:640px}
.chart-wrap.mid{height:380px}
.chip-m .sw{margin-right:8px}
/* 표 행 강조/흐림 */
.tbl tr.hl td{background:#f3f2ee;font-weight:500}
.tbl tr.dim td{opacity:.35}
/* 접힘(필터): v40 — 숨긴 행은 자리를 차지하지 않음(이전 접힘 애니메이션은 숨긴 행마다 1px 안팎이 남아 보이는 행 사이 간격이 고르지 않았음) */
.tbl td{transition:opacity .25s ease}
.tbl tr.fold{display:none}
.tbl tr.sep td{border-top:2px solid var(--rule);padding-top:20px}
/* bar chart race (DOM) */
.race-stage{position:relative;overflow:hidden;padding-left:28px}
.race-row{position:absolute;left:0;right:0;height:36px;display:flex;align-items:center;gap:10px;will-change:transform}
.race-rank{width:22px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink);background:none}
.race-track{position:relative;flex:1;height:26px}
.race-fill{position:absolute;left:0;top:0;height:100%;border-radius:0 3px 3px 0;min-width:2px}
.race-name{position:absolute;left:10px;top:0;height:26px;line-height:26px;font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;text-shadow:0 0 3px rgba(0,0,0,.45)}
.race-val{width:96px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
table.tbl.compact{width:auto}
.tbl-scroll.compact{display:inline-block;max-width:100%;vertical-align:top}   /* v24: 내용 폭 표(옆으로 퍼지지 않음) */
.tbl.compact th,.tbl.compact td{padding-left:8px;padding-right:8px}
.tbl td small{color:var(--ink-2);font-size:12px}
/* 히트맵(트리맵) v14 */
.treemap-host{position:relative;width:100%;overflow:hidden;border:1px solid var(--rule);border-radius:4px;background:#fff}
.tm-group{position:absolute;overflow:hidden;background:#f6f6f7}
.tm-head{height:20px;line-height:20px;padding:0 6px;font-size:12px;font-weight:600;border-top:3px solid;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-head small{font-weight:400;color:var(--ink-2);font-size:11px}
.tm-head .sw{margin-right:6px;vertical-align:0}
.tm-body{position:absolute;left:2px;right:2px;top:22px;bottom:2px}
.tm-cell{position:absolute;overflow:hidden;box-sizing:border-box;padding:3px 4px;border:1px solid rgba(255,255,255,.9);cursor:default;line-height:1.2}
.tm-cell:hover{outline:2px solid #17171c;outline-offset:-2px;z-index:2}
.tm-n{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-c{font-size:11px;font-variant-numeric:tabular-nums;opacity:.9}
.tm-mgr{position:absolute;overflow:hidden;background:#e9e9ee;border:1px solid #fff}
.tm-mhead{height:16px;line-height:16px;padding:0 4px;font-size:10.5px;font-weight:600;color:#33333d;background:#e9e9ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-mhead small{font-weight:400;color:#75758a;font-size:10px}
.tm-mbody{position:absolute;left:1px;right:1px;bottom:1px}
.tm-tip{display:none;position:absolute;z-index:5;max-width:300px;padding:8px 10px;background:#17171c;color:#fff;font-size:12px;line-height:1.45;border-radius:6px;white-space:pre-line;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.tm-legend{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.tm-legend i{display:inline-block;width:28px;height:12px;border:1px solid var(--rule-2)}
.tm-legend span{margin:0 6px}
/* v16: 개관 탭 폭 제한, 신규상장 운용사 표 접기, 목록 상단 고정 */
body.narrow-tab .view{max-width:none}   /* v41: Apps Script 는 본문 폭 제한 해제(넓은 창에서 오른쪽 빈 공간 → 머리글과 같은 폭) */
.fold-head td{cursor:pointer;color:var(--ink-2)}
.fold-head:hover td{background:#fafaf8}
.fold-btn{display:inline-block;width:14px;margin-right:4px;font-size:11px;color:var(--ink-2)}
.fold-item td{color:var(--ink-2)}
.sticky-sec .section-h{position:sticky;top:var(--hdr-h,0px);z-index:5;background:var(--canvas);padding-top:6px;margin-bottom:0}
.sticky-chips{position:sticky;top:calc(var(--hdr-h,0px) + var(--sec-h,44px));z-index:5;background:var(--canvas);padding:6px 0 2px;border-bottom:1px solid var(--rule-2);margin-bottom:8px}
.tm-c{white-space:nowrap}
/* v19: 표 도구(검색·CSV·정렬), 경영진 요약, ACE 강조 모드, 인쇄 */
.tbl-tools{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.tbl-q{font:13px var(--font);border:1px solid var(--rule);border-radius:4px;padding:6px 10px;min-width:220px;color:var(--ink)}
.tbl-cnt{font-size:12px;color:var(--ink-2)}
.tbl-csv{margin-left:auto;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:4px;padding:5px 12px;font:12px var(--font);cursor:pointer}
.tbl-csv:hover{border-color:var(--black)}
.tbl.sortable th[data-sort]{cursor:pointer;user-select:none}
.tbl.sortable th[data-sort]:hover{color:var(--ink)}
.tbl.sortable th.asc::after{content:' \25B2';font-size:9px}.tbl.sortable th.desc::after{content:' \25BC';font-size:9px}
.tbl tr.q-hide{display:none}
.sum-lines ul{margin:0;padding-left:20px;font-size:15px;line-height:1.75}
.sum-lines li{margin:2px 0}.sum-lines b{font-weight:600}
.ctl-focus{justify-content:flex-end}
.seg-one{display:inline-flex;align-items:center;border:1px solid var(--black);background:transparent;color:var(--black);border-radius:30px;padding:8px 14px;font:500 13px var(--font);cursor:pointer}
.seg-one.on{background:var(--black);color:#fff}.seg-one .sw{margin-right:6px}
body.focus-on .tbl tr[data-top]:not([data-top="한투"]) td{opacity:.42}
body.focus-on .tbl tr[data-top="한투"] td{font-weight:500;background:#f7f4ef}
body.focus-on .tbl tr[data-top="한투"] td:first-child{box-shadow:inset 3px 0 0 #7A4A1D}
body.focus-on .tm-cell:not([data-top="한투"]){opacity:.38}
body.focus-on .tm-cell[data-top="한투"]{outline:2px solid #17171c;outline-offset:-2px;z-index:1}
body.focus-on .tm-mgr[data-top="한투"]{outline:2px solid #7A4A1D;outline-offset:-1px}
body.focus-on .race-row .race-name{opacity:.9}
/* v24: 요약 탭 '핵심 요약' 표(항목·내용 2열) */
.kv-wrap{margin-top:2px}
table.kv{width:100%;border-collapse:collapse;font-size:15px}
.kv th{width:150px;text-align:left;vertical-align:top;font-weight:500;color:var(--ink-2);padding:11px 16px 11px 0;border-bottom:1px solid var(--rule-2);white-space:nowrap}
.kv td{padding:11px 0;border-bottom:1px solid var(--rule-2);line-height:1.6;word-break:keep-all}
.kv tr:first-child th,.kv tr:first-child td{border-top:1px solid var(--rule)}
.kv b{font-weight:600}
/* v29 테마 맵 */
.th-bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 22px;margin:14px 0 18px}
/* v42: NAV 증감 요인(설정액·평가 증감) — 선택 줄(유형·운용사 칩 + 지표·연도) · v43: 그림 제목 줄(제목·단위·유입/유출 견본) · 월별 표 보기 */
.flow-bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 22px;margin:4px 0 8px}.flow-bar .chips{margin:0}.flow-rng{flex-direction:row;align-items:center;gap:8px}.flow-rng .seg button{padding:6px 12px;font-size:13px}
.flow-ct{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin:14px 0 2px;font-size:13px;color:var(--ink-2)}.flow-ct b{font-weight:600;color:var(--black)}.flow-ct .u{font-size:12px;color:#898781}.flow-ct .lg{margin-left:auto;font-size:12px;display:inline-flex;align-items:center;gap:4px 6px}.flow-ct .lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:8px}
.flow-g2>div{min-width:0}
/* v50: 섹션 접기(App.collapse) — 제목 줄 오른쪽 버튼, 접힌 동안 제목 줄 아래 여백 없음 */
.section-h .sec-tg{align-self:center;padding:5px 12px;font-size:12px}
.section.collapsed>.section-h{margin-bottom:0}
/* v51: 유형별 종합표 — 칸 = 값(위) + 변동(아래 작은 글자), 시장 4줄 · 운용사별 M/S 구분 줄 · 1~5위 + 기타 접기 */
.type-mx{margin-bottom:6px}
.type-mx .tbl td{vertical-align:top;font-variant-numeric:tabular-nums}
.type-mx .tbl td small{display:block;font-size:11.5px;line-height:1.3;min-height:1.3em}
.type-mx .tbl tr.mx-lab td{text-align:left;padding-top:18px;border-top:2px solid var(--rule);font-weight:600}
.type-mx .tbl tr.mx-lab td small,.type-mx .tbl td small.mx-in{display:inline;min-height:0;margin-left:6px;font-weight:400}
.type-mx .mx-rk{display:inline-block;min-width:18px;color:var(--ink-2);font-size:12px}
.type-mx .tbl th .sw{margin-right:4px}
/* v47: 오른쪽 고정 열(A.stickRight) — 종목명만 가로 스크롤. 흐림(강조 모드·선택 외 행)은 투명도 대신 흰 덮개(밑에 지나가는 종목명이 비치지 않게) */
.tbl td.stk,.tbl th.stk{position:sticky;z-index:1;background:#fff}
.tbl .stk-edge{box-shadow:-10px 0 8px -8px rgba(0,0,0,.14)}
body.focus-on .tbl tr[data-top]:not([data-top="한투"]) td.stk,.tbl tr.dim td.stk{opacity:1}
body.focus-on .tbl tr[data-top]:not([data-top="한투"]) td.stk::after,.tbl tr.dim td.stk::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.6);pointer-events:none}.flow-tb{margin:8px 0 4px}.flow-tb summary{cursor:pointer;font-size:13px;color:var(--ink-2);padding:4px 0}.flow-tb[open] summary{margin-bottom:6px}
.th-bar .seg button{padding:6px 12px;font-size:13px}
.th-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 0;font-size:12px;color:var(--ink-2)}
.th-lg{display:inline-flex;align-items:center}
.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:#f7f7f5}.tbl tr.sel td{background:#f3f2ee;font-weight:500}
.qd{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid #d4d4d8;color:#52525b;white-space:nowrap}
.qd-b{border-color:#17171c;color:#17171c;font-weight:600}
/* v29 종목→ETF 찾기 */
