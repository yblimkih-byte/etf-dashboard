<script>
/* ── 탭 정의. 새 탭 = App.registerTab({...}) 1개 추가 (→ 탭추가_가이드.md) ─────────────

/* v19: 유형색 — 명도 계단(검정·청·중회·보라·청록·연회)으로 인접 구간 구분. 혼합채권형은 검정과 가깝던 짙은 녹색 → 청록 */
const TYPE_COLORS = { '국내주식형': '#17171c', '해외주식형': '#1863dc', '채권형': '#75758a', '파생형': '#9b60aa', '혼합채권형': '#2a9d8f', '기타': '#c4c4cc', '미분류': '#e5e7eb' };
const DOM_COLORS = { '국내': '#17171c', '해외': '#1863dc' };
const tc = t => TYPE_COLORS[t] || '#c4c4cc';
const GROUPS = () => App.meta.top5.concat(['기타']);
const isQ = ym => /-(03|06|09|12)$/.test(ym);
/* 기준일 표기: 월말 스냅샷은 '연-월', 당월 영업일은 날짜 */
const dlabel = d => (d && d.slice(0, 7) < App.meta.curMonth) ? d.slice(0, 7) : d;
/* 축 라벨 '2026-01' → ['26', '-01'] (두 줄) */
const ymTick = ym => [String(ym).slice(2, 4), String(ym).slice(4, 7)];
/* 증감 레이블 '(+0.0조, +0.0%p)' */
const deltaLabel = (A, cur, py, shCur, shPy) => `${A.signed(cur - py)}조\n${A.pct(shCur - shPy).replace('%', '%p')}`;
const Y_W = 56;   // 위아래로 놓는 차트의 Y축 폭 고정(X축 정렬)

/* ── 히트맵(트리맵) 렌더러(v14, v15 운용사 중단 추가): 유형(1단) > 운용사(2단) > 개별 ETF(3단). squarify 배치, DOM 박스, 색 = 증감액 발산 스케일 ── */
function squarify(items, x, y, w, h) {   // items: [{v,...}] → [{x,y,w,h,item}]
  const out = [], total = items.reduce((s, i) => s + i.v, 0); if (!total || w <= 0 || h <= 0) return out;
  let rest = items.slice(), rx = x, ry = y, rw = w, rh = h; const scale = w * h / total;
  const worst = (row, len) => { const s = row.reduce((a, b) => a + b.v * scale, 0); if (!s) return Infinity; const mx = Math.max.apply(null, row.map(i => i.v * scale)), mn = Math.min.apply(null, row.map(i => i.v * scale)); return Math.max(len * len * mx / (s * s), s * s / (len * len * mn)); };
  while (rest.length) {
    const len = Math.max(1, Math.min(rw, rh)); let row = [rest[0]], k = 1;
    while (k < rest.length && worst(row.concat([rest[k]]), len) <= worst(row, len)) { row.push(rest[k]); k++; }
    rest = rest.slice(k);
    const s = row.reduce((a, b) => a + b.v * scale, 0);
    if (rw >= rh) { const cw = s / rh; let cy = ry; row.forEach(i => { const ch = i.v * scale / cw; out.push({ x: rx, y: cy, w: cw, h: ch, item: i }); cy += ch; }); rx += cw; rw -= cw; }
    else { const ch = s / rw; let cx = rx; row.forEach(i => { const cw = i.v * scale / ch; out.push({ x: cx, y: ry, w: cw, h: ch, item: i }); cx += cw; }); ry += ch; rh -= ch; }

/* 브랜드 + 명칭 앞부분 (박스 폭에 맞춰 줄임) */
function shortName(name, maxChars) { const s = String(name || '').replace(/\s+/g, ' ').trim(); return s.length > maxChars ? s.slice(0, Math.max(1, maxChars - 1)) + '…' : s; }
/* v24: 서버 행 배열(rows: [종목명, 운용사, 상위구분, 유형, NAV(억원), 증감(억원), 신규상장 상장일|0]) → 객체. 이전 형식(items)도 허용 */
function tmItems(d) {
  if (!d.rows) return d.items || [];
  const u = d.unit || 1;
  return d.rows.map(r => ({ name: r[0], mgr: r[1], top: r[2], type: r[3], nav: r[4] * u, chg: r[5] === null || r[5] === undefined ? null : r[5] * u, isNew: !!r[6], listDd: r[6] || '' }));
}
/* v24: 유형을 위아래 띠로 쌓는 배치(폭이 좁을 때). 높이 ∝ NAV, 작은 유형도 최소 높이 확보 */
function tmBands(groups, W, H, minH) {
  const fixed = {}; let hs = [];
  for (let it = 0; it <= groups.length; it++) {
    const nFix = Object.keys(fixed).length, freeV = groups.reduce((s, g, i) => s + (fixed[i] ? 0 : g.v), 0), freeH = H - nFix * minH;
    hs = groups.map((g, i) => fixed[i] ? minH : freeH * g.v / (freeV || 1));
    const more = hs.map((h, i) => !fixed[i] && h < minH ? i : -1).filter(i => i >= 0);
    if (!more.length) break; more.forEach(i => { fixed[i] = 1; });
  }

}
function treemap(A, host, d) {
  host.innerHTML = '';

  const items = (d._items || (d._items = tmItems(d))).filter(i => i.nav > 0);
  const byType = {}; items.forEach(i => (byType[i.type] = byType[i.type] || []).push(i));
  const order = A.meta.typeOrder.concat(Object.keys(byType).filter(k => A.meta.typeOrder.indexOf(k) < 0)).filter(k => byType[k]);
  const groups = order.map(k => ({ v: byType[k].reduce((s, i) => s + i.nav, 0), key: k, items: byType[k] }));
  // v24: 폭이 좁으면(폭 제한 탭·모바일) 유형을 위아래 띠로 쌓고 높이를 늘림, 넓으면 기존 squarify 배치
  const W = Math.max(320, host.clientWidth || 1000), banded = W < 1100, H = banded ? Math.max(560, Math.round(W * 0.95)) : Math.max(480, Math.round(W * 0.7));
  host.style.height = H + 'px';
  host.classList.toggle('tm-banded', banded);
  const chgs = items.map(i => i.chg).filter(v => v !== null).map(Math.abs).sort((a, b) => a - b);
  const cap = (chgs.length ? chgs[Math.floor(chgs.length * 0.9)] : 0) || 1e12;   // 상위 10% 이상은 최대 채도
  // v19: 색 대비 확대 — 증가는 녹색 명도 계단(연녹→진녹), 감소는 적색 명도 계단(연분홍→진적). 0 부근은 중립 회백으로 두어 방향이 없을 때 색이 없음
  const col = chg => { if (chg === null) return '#d4d4d8'; const t = Math.min(1, Math.abs(chg) / cap); if (t < 0.04) return '#ececef'; const up = chg >= 0; const r = up ? Math.round(226 - 200 * t) : Math.round(250 - 60 * t), g = up ? Math.round(240 - 130 * t) : Math.round(228 - 200 * t), b = up ? Math.round(226 - 170 * t) : Math.round(226 - 190 * t); return `rgb(${r},${g},${b})`; };
  const HEAD = 20, MHEAD = 16, PAD = 2, MIN_MGR_AREA = 4200, MIN_CELL = 1600;   // 운용사 칸 최소 면적(px²) 미만은 '기타 운용사'로 묶음 · v19: ETF 박스 최소 면적 900→1,600(작은 박스는 '기타 n종목'으로)
  /* ETF 박스 채우기: 컨테이너(inner, iw×ih)에 list 를 squarify. 작은 박스는 '기타 n종목' */
  const fillCells = (inner, list, iw, ih) => {

    const all = list.slice().sort((a, b) => b.nav - a.nav).map(i => ({ v: i.nav, it: i }));
    const unit = iw * ih / tot, small = all.filter(x => x.v * unit < MIN_CELL), big = all.filter(x => x.v * unit >= MIN_CELL);

    squarify(big, 0, 0, iw, ih).forEach(c => {
      const it = c.item.it, el = document.createElement('div'); el.className = 'tm-cell';
      const w = c.w - 1, h = c.h - 1; if (w < 2 || h < 2) return;

      if (it.top) el.setAttribute('data-top', it.top);   // v19: 강조 모드(한투 박스 테두리·나머지 흐림)용
      const chars = Math.max(2, Math.floor(w / 7.2));
      // v19: 이름은 6자 이상 들어갈 때만 표기(잘린 'KO…' 표기 제거), 그 미만은 툴팁으로만
      if (w >= 48 && h >= 26 && chars >= 6) el.innerHTML = `<div class="tm-n">${shortName(it.name, chars)}</div>` + (h >= 40 ? `<div class="tm-c">${A.eok(it.nav)}${it.chg === null ? '' : ` (${A.signed(it.chg)})`}</div>` : '');
      const tipName = it.others ? it.others.slice(0, 12).map(o => o.name).join(', ') + (it.others.length > 12 ? ` 외 ${it.others.length - 12}종목` : '') : it.name;
      el.setAttribute('data-tip', `${tipName}` + (it.mgr && !it.others ? `\n${it.mgr}` : '') + `\nNAV ${A.eok(it.nav)}조원` + (it.chg === null ? `\n${A.refLabel(d)} 자료 없음` : `\n${it.isNew ? '상장(' + it.listDd + ') 이후' : A.refLabel(d) + ' 대비'} ${A.signed(it.chg)}조원`));
      inner.appendChild(el);
    });
  };
  (banded ? tmBands(groups, W, H, 62) : squarify(groups, 0, 0, W, H)).forEach(g => {
    const box = document.createElement('div'); box.className = 'tm-group';
    box.style.cssText = `left:${g.x + 1}px;top:${g.y + 1}px;width:${Math.max(0, g.w - 2)}px;height:${Math.max(0, g.h - 2)}px`;
    box.innerHTML = `<div class="tm-head" style="border-color:${tc(g.item.key)}"><span class="sw" style="background:${tc(g.item.key)}"></span>${g.item.key} <small>${A.eok(g.item.v)}조 · ${g.item.items.length}종목</small></div>`;
    const inner = document.createElement('div'); inner.className = 'tm-body'; box.appendChild(inner);
    const iw = g.w - 2 - PAD * 2, ih = g.h - 2 - HEAD - PAD * 2;
    if (iw <= 4 || ih <= 4) { host.appendChild(box); return; }
    // v15: 유형 안을 운용사(중유형)로 나눔. NAV 큰 순, 면적이 작은 운용사는 '기타 운용사'로 묶음
    const byMgr = {}; g.item.items.forEach(i => { const k = i.mgr || '미상'; (byMgr[k] = byMgr[k] || []).push(i); });
    const unit = iw * ih / (g.item.v || 1);
    let mgrs = Object.keys(byMgr).map(k => ({ key: k, v: byMgr[k].reduce((s, i) => s + i.nav, 0), items: byMgr[k] })).sort((a, b) => b.v - a.v);
    const small = mgrs.filter(m => m.v * unit < MIN_MGR_AREA), big = mgrs.filter(m => m.v * unit >= MIN_MGR_AREA);
    if (small.length > 1) big.push({ key: `기타 운용사 ${small.length}사`, v: small.reduce((s, m) => s + m.v, 0), items: small.reduce((a, m) => a.concat(m.items), []), etc: true }); else big.push.apply(big, small);
    mgrs = big;
    if (mgrs.length === 1) { fillCells(inner, mgrs[0].items, iw, ih); host.appendChild(box); return; }
    squarify(mgrs, 0, 0, iw, ih).forEach(m => {
      const mb = document.createElement('div'); mb.className = 'tm-mgr'; if (m.item.items[0] && m.item.items[0].top && !m.item.etc) mb.setAttribute('data-top', m.item.items[0].top);
      const mw = Math.max(0, m.w - 2), mh = Math.max(0, m.h - 2);
      mb.style.cssText = `left:${m.x + 1}px;top:${m.y + 1}px;width:${mw}px;height:${mh}px`;
      const showHead = mw >= 36 && mh >= MHEAD + 14;
      const mchg = m.item.items.reduce((s, i) => s + (i.chg || 0), 0);
      if (showHead) mb.innerHTML = `<div class="tm-mhead" title="${m.item.key} · ${A.eok(m.item.v)}조원 · ${m.item.items.length}종목 · ${A.refLabel(d)} 대비 ${A.signed(mchg)}조원">${m.item.key}${mw >= 110 ? ` <small>${A.eok(m.item.v)}조</small>` : ''}</div>`;
      const mi = document.createElement('div'); mi.className = 'tm-mbody'; mi.style.top = (showHead ? MHEAD : 0) + 'px'; mb.appendChild(mi);
      fillCells(mi, m.item.items, mw - 2, mh - (showHead ? MHEAD : 0) - 2);
      inner.appendChild(mb);
    });
    host.appendChild(box);
  });
  // 커스텀 툴팁 (즉시 표시)
  const tip = document.createElement('div'); tip.className = 'tm-tip'; host.appendChild(tip);
  host.onmousemove = e => { const c = e.target.closest('.tm-cell'); if (!c) { tip.style.display = 'none'; return; } tip.textContent = c.getAttribute('data-tip'); tip.style.display = 'block'; const r = host.getBoundingClientRect(); let x = e.clientX - r.left + 14; const y = e.clientY - r.top + 14; if (x + 300 > W) x = Math.max(0, e.clientX - r.left - 314); tip.style.left = x + 'px'; tip.style.top = y + 'px'; };
  host.onmouseleave = () => { tip.style.display = 'none'; };
  const legend = document.createElement('div'); legend.className = 'tm-legend';
  legend.innerHTML = `<span>${A.refLabel(d)} 대비 감소</span><i style="background:${col(-cap)}"></i><i style="background:${col(-cap / 2)}"></i><i style="background:${col(0)}"></i><i style="background:${col(cap / 2)}"></i><i style="background:${col(cap)}"></i><span>증가 (±${A.eok(cap)}조원 이상은 최대 채도) · 유형 안은 운용사별(NAV 순, 작은 운용사는 '기타 운용사')</span>`;
  host.parentElement.appendChild(legend);
  let raf; const onResize = () => { if (!host.isConnected) { window.removeEventListener('resize', onResize); return; } cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { if (Math.abs((host.clientWidth || W) - W) > 40) { window.removeEventListener('resize', onResize); treemap(A, host, d); } }); };
  window.addEventListener('resize', onResize);
}

/* v24: M/S 변동 요인 — 운용사·시장의 NAV 증감률 비교(유형별). byMgr.mix = {mkt:{유형:[기준일, 비교 기준]}, mgr:{운용사:{유형:[…]}}}
   (v19~v23 의 '점유율 효과·구성 효과' 기여도 분해는 보고·실무용으로 이해가 어려워 제거)
   v26: 유형별 M/S 기여 c = (운용사 증감액 − 시장 증감액 × 비교 기준 M/S) ÷ 기준일 시장 NAV (%p) — 유형별 합계 = M/S 변동(정확히 일치)
        의미: 시장 증가분 중 운용사 몫(cap = 운용사 증감액 ÷ 시장 증감액)이 비교 기준 M/S 보다 작은 유형은 하락 요인, 큰 유형은 상승 요인
        (v24 의 '주력 유형 중 증감률 차이 최대'는 운용사 비중이 작은 유형을 빼고 증감률만 비교해, 비중이 작은 급성장 유형(예: 한투 국내주식형)을 놓쳤음) */
function growthRows(d, g) {
  const mix = d.mix || { mkt: {}, mgr: {} }, mg = mix.mgr[g] || {}, types = (d.types || Object.keys(mix.mkt)).filter(t => mix.mkt[t]);
  const pc = (a, b) => b ? (a / b - 1) * 100 : null, tot = [0, 0], mt = [0, 0];
  types.forEach(t => { const x = mg[t] || [0, 0], k = mix.mkt[t]; tot[0] += x[0]; tot[1] += x[1]; mt[0] += k[0]; mt[1] += k[1]; });
  const s0 = mt[1] ? tot[1] / mt[1] : null, s1 = mt[0] ? tot[0] / mt[0] : null;
  const rows = types.map(t => {
    const x = mg[t] || [0, 0], k = mix.mkt[t], dM = k[0] - k[1], dF = x[0] - x[1];
    return { type: t, cur: x[0], py: x[1], gf: pc(x[0], x[1]), gm: pc(k[0], k[1]), w: tot[0] ? x[0] / tot[0] * 100 : 0, wPy: tot[1] ? x[1] / tot[1] * 100 : 0,
      dM: dM, dF: dF, cap: dM > 0 ? dF / dM * 100 : null, c: s0 === null || !mt[0] ? null : (dF - s0 * dM) / mt[0] * 100 };
  });
  const dM = mt[0] - mt[1], dF = tot[0] - tot[1];
  return { rows, cur: tot[0], py: tot[1], gf: pc(tot[0], tot[1]), gm: pc(d.total, d.totalPy), ok: !!d.mix, dM: dM, dF: dF, cap: dM > 0 ? dF / dM * 100 : null,
    s0: s0 === null ? null : s0 * 100, s1: s1 === null ? null : s1 * 100, dms: s0 === null || s1 === null ? null : (s1 - s0) * 100 };
}
/* v26: M/S 변동을 만든 주요 유형 — 변동과 같은 방향의 기여 중 큰 순 최대 2개(0.05%p 미만 제외). 없으면 절댓값 최대 1개 */
function msDrivers(gr) {

  let out = sg ? xs.filter(r => Math.sign(r.c) === sg && Math.abs(r.c) >= 0.05).sort((a, b) => Math.abs(b.c) - Math.abs(a.c)).slice(0, 2) : [];

  return out;
}
/* v27: 반대 방향 최대 기여(0.1%p 이상) — M/S 가 늘었어도 크게 끌어내린 유형(또는 줄었어도 크게 끌어올린 유형)을 함께 표시
   예: 2025-06 한투 M/S +0.23%p = 기타 +0.27 · 해외주식형 +0.20 · 혼합채권형 +0.12 … 국내주식형 −0.26%p(상쇄) */
function msOffset(gr) {
  const sg = gr.dms === null || Math.abs(gr.dms) < 0.005 ? 0 : Math.sign(gr.dms);
  if (!sg) return null;
  return gr.rows.filter(r => r.c !== null && Math.sign(r.c) === -sg && Math.abs(r.c) >= 0.1).sort((a, b) => Math.abs(b.c) - Math.abs(a.c))[0] || null;
}
/* v26: 주요 유형 문구 — '하락 요인 국내주식형 −0.86%p · 파생형 −0.31%p (시장 증가분 중 한투 몫 3.9% · 1.4% vs 전년말 M/S 8.53%)'
   v27: 반대 방향 최대 기여가 0.1%p 이상이면 ' · 상쇄 요인 국내주식형 −0.26%p (한투 몫 3.3%)' 추가 */
function msDriverText(A, gr, mgr, RL) {

    // v26: 유형별 M/S 기여 = (운용사 증감액 − 시장 증감액 × 비교 기준 M/S) ÷ 기준일 시장 NAV · 시장 증가분 중 운용사 몫이 비교 기준 M/S 보다 작은 유형이 하락 요인. 유형별 합계 = M/S 변동
    if (d.mix) {

      const chipBox = A.div(sc), wrap = A.div(sc), pp2 = v => v === null || v === undefined ? '-' : A.pct(v, 2).replace('%', '%p');
      const draw = sel => {
        const who = sel || A.FOCUS, r0 = byK[who] || d.rows[0], gr = growthRows(d, r0.mgr);
        wrap.innerHTML = '';
        A.sub(wrap, `${r0.mgr}: NAV ${gpct(A, gr.gf, gr.cur)} vs 시장 ${A.pct(gr.gm)} → M/S ${A.share(gr.s0, 2)} → ${A.share(gr.s1, 2)} (${pp2(gr.dms)})`);
        const dt = msDriverText(A, gr, r0.mgr, RL); if (dt) A.div(wrap, 'note ms-drv', dt);
        const capCls = r => r.cap === null || gr.s0 === null ? '' : A.clsP(r.cap - gr.s0);
        A.div(wrap, '', A.table(gr.rows.filter(r => r.cur || r.py), [
          { h: '유형', f: r => A.swc(tc(r.type)) + r.type, l: 1 },
          { h: '시장 증감액(조원)', f: r => A.signed(r.dM), cls: r => A.cls(r.dM) },
          { h: `${r0.mgr} 증감액(조원)`, f: r => A.signed(r.dF), cls: r => A.cls(r.dF) },
          { h: `시장 증가분 중 ${r0.mgr} 몫`, f: r => r.cap === null ? (r.dM < 0 ? '시장 감소' : '-') : A.share(r.cap), cls: capCls },
          { h: 'M/S 기여(%p)', f: r => pp2(r.c), cls: r => r.c === null ? '' : A.clsP(r.c) },
          { h: `${r0.mgr} 내 비중`, f: r => A.share(r.w) }
        ], { compact: true, tools: false, total: { '유형': '합계', '시장 증감액(조원)': A.signed(gr.dM), [`${r0.mgr} 증감액(조원)`]: A.signed(gr.dF), [`시장 증가분 중 ${r0.mgr} 몫`]: gr.cap === null ? '-' : A.share(gr.cap), 'M/S 기여(%p)': pp2(gr.dms), [`${r0.mgr} 내 비중`]: '100.0%' } }));
        A.div(wrap, 'note', `시장 증가분 중 ${r0.mgr} 몫: ${RL} M/S(${A.share(gr.s0, 2)})보다 작으면 빨강, 크면 파랑 표시 · ${r0.mgr} 내 비중 = 기준일 ${r0.mgr} NAV 중 유형 비중`);
      };
      A.chips(chipBox, keys, { hint: '운용사 선택', selected: A.FOCUS, onSelect: sel => draw(sel) });
      draw(A.FOCUS);
    }

    const s2 = A.section(root, '월별 M/S 추이', '2021년 이후 · 레이블 3·6·9·12월');
    const tot = t => keys.reduce((s, x) => s + (t[x] || 0), 0), last = d.trend.length - 1;
    const mark = i => isQ(d.trend[i].ym) || i === last;
    A.line(A.canvas(s2, 'tall'), d.trend.map(t => t.ym), keys.map(k => ({ label: k, color: A.color(k), fill: A.fade(A.color(k), 0.85), data: d.trend.map(t => { const T = tot(t); return T ? +((t[k] || 0) / T * 100).toFixed(2) : 0; }) })),
      { area: true, max: 100, padRight: 56, fmt: v => v.toFixed(1) + '%', legendPos: 'bottom', xTickFmt: (i, l) => mark(i) ? ymTick(l) : '',
        labels: { mode: 'area', size: 11, only: mark, fmt: v => v.toFixed(1) + '%' } });
  }
});

/* 3. 유형별 NAV (v24: 폭 제한 · 두 막대를 위아래로 · 히트맵은 유형별 띠 배치, 화면을 그리기 전에 히트맵 자료 요청) */
App.registerTab({

    const s1 = A.section(root, '유형별 NAV 및 비중', `막대 사이 = (증감액, 비중 변동) · 비교 기준 ${RL}`);

    const cols = [
      { h: '구분', f: r => A.swc(r.type ? tc(r.type) : (DOM_COLORS[r.dom] || '#c4c4cc')) + (r.type || r.dom), l: 1 }, { h: '잔고(조원)', f: r => A.eok(r.nav) },
      { h: '증감액', g: G, f: r => A.signed(r.ytd.amt), cls: r => A.cls(r.ytd.amt) }, { h: '증감률', g: G, f: r => A.pct(r.ytd.pct), cls: r => A.clsP(r.ytd.pct) },
      { h: '증감액', g: '전월 대비', f: r => A.signed(r.mom.amt), cls: r => A.cls(r.mom.amt) }, { h: '증감률', g: '전월 대비', f: r => A.pct(r.mom.pct), cls: r => A.clsP(r.mom.pct) },
      { h: '기준일', g: '비중', f: r => A.share(r.share) }, { h: RL, g: '비중', f: r => A.share(r.sharePy) }, { h: '변동(%p)', g: '비중', f: r => r.sharePy === null ? '-' : A.pct(r.share - r.sharePy).replace('%', '%p'), cls: r => A.clsP(r.share - (r.sharePy || 0)) }
    ];
    A.div(s1, '', A.table(d.rows.concat(d.dom), cols, { compact: true, tools: false, attr: r => r === d.dom[0] ? 'class="sep"' : '', total: { '구분': '합계', '잔고(조원)': A.eok(d.total), [G + '|증감액']: A.signed(d.total - d.totalPy), [G + '|증감률']: A.pct(d.totalPy ? (d.total / d.totalPy - 1) * 100 : null), '비중|기준일': '100.0%', ['비중|' + RL]: '100.0%' } }));

    // v14/v15: 유형 > 운용사 > 개별 ETF 히트맵(트리맵). 넓이 = 기준일 NAV, 색·숫자 = 비교 기준 대비 NAV 증감. v24: 폭이 좁으면 유형을 위아래 띠로
    const s2 = A.section(root, '유형별 ETF 히트맵', `넓이 = NAV · 색 = ${RL}(${dlabel(d.ref.py) || '-'}) 대비 증감 · 유형은 위아래 띠(높이 = NAV), 띠 안은 운용사별 · 작은 종목은 이름 없이 마우스 올리면 표시`);
    const host = A.div(s2, 'treemap-host'); host.innerHTML = '<div class="loading">히트맵 데이터를 불러오는 중…</div>';

/* 4. 상위 5개사 및 시장 전체 — 유형별 비중 */

        tooltip: (c, v) => { const x = cell(names[c.dataIndex], c.dataset.label); return ` ${c.dataset.label}: ${A.eok(x ? x.nav : 0)}조원, ${v.toFixed(1)}%`; },

      .concat(types.map(t => ({ h: t, g: '유형별 NAV / 비중', f: r => { const x = r.types.find(y => y.type === t); return x && x.nav ? `${A.eok(x.nav)} <small>/ ${A.share(x.share)}</small>` : '-'; } }))),

/* 공용: 운용사 선택 칩 — 차트 막대·표 행 강조 */
/** v18: 섹션 제목(.section-h)과 바로 아래 칩(.sticky-chips)을 스크롤 시 상단 고정. 칩 위치 = 머리글 높이 + 제목 높이(실측) */
function stickyHead(sec) {
  sec.classList.add('sticky-sec');
  const set = () => {
    const hdr = document.querySelector('.top, .hdr-wrap'); if (hdr) document.documentElement.style.setProperty('--hdr-h', hdr.offsetHeight + 'px');
    const h = sec.querySelector('.section-h'); if (h && h.offsetHeight) sec.style.setProperty('--sec-h', h.offsetHeight + 'px');
  };
  set(); requestAnimationFrame(set);
}
/** v18: 신규상장 목록 NAV(조원) — 소수 둘째 자리(셋째 자리에서 반올림), 둘째 자리까지 0.00 이면 셋째 자리까지 */
function navSmall(A, v) { const t = A.eok(v, 2); return /^-?0\.00$/.test(t) && v ? A.eok(v, 3) : t; }
function mgrChips(A, parent, opts) {
  const keys = GROUPS();
  return A.chips(parent, keys, { hint: opts.hint || '운용사 선택 시 해당 운용사 상품 강조', reset: !!opts.reset, onSelect: sel => {
    if (opts.chart) { opts.chart.data.datasets[0].backgroundColor = opts.rowsTop.map(t => !sel || t === sel ? A.focusColor(A.color(t), t) : A.fade(A.color(t), 0.18)); opts.chart.update(); }
    (opts.hosts || []).forEach(h => A.highlightRows(h, sel));
    (opts.filterHosts || []).forEach(h => A.filterRows(h, sel));
  } });
}

/* v24: 변천 자료 행 배열(rows: [순위, 종목코드, 종목명, 상위구분, NAV(억원), 채권/금리 1|0, 유형]) → 객체. 이전 형식(객체 행)도 허용 */
function raceFrames(r) {
  const u = r.unit || 1;
  return (r.frames || []).map(f => ({ ym: f.ym, rows: f.rows.map(x => Array.isArray(x) ? { rank: x[0], code: x[1], name: x[2], top: x[3], nav: x[4] * u, bond: !!x[5], type: x[6] } : x) }));
}

/* 5. 상위 ETF (v24: 폭 제한 · 변천에 '상위 20 내 유형별 M/S' 막대 추가) */
App.registerTab({
  id: 'top', narrow: true, label: '상위 ETF', controls: ['date'], action: 'topEtf', params: s => ({ date: s.date }),
  prefetch: () => [['race', { n: 20 }]],
  render(d, root, A) {
    const N = d.top.length;
    // ① 상위 20 ETF 막대
    const s1 = A.section(root, '상위 20 ETF', `기준일 ${dlabel(d.date)} · NAV(조원) · 색 = 운용사`);
    const chipBox1 = A.div(s1);
    const t20 = d.top.slice(0, 20);
    const chart = A.bar(A.canvas(s1, 'tall'), t20.map(r => r.name), [{ label: 'NAV', data: t20.map(r => r.nav), colors: t20.map(r => A.color(r.top)) }], { horizontal: true, noLegend: true, noTooltip: true, padRight: 40, labels: { mode: 'end', fmt: v => A.eok(v) } });
    mgrChips(A, chipBox1, { chart: chart, rowsTop: t20.map(r => r.top) });

    // ② bar chart race (상위 20)
    const s2 = A.section(root, 'NAV 상위 20 변천 (2021년 이후 월별)');
    const holder = A.div(s2, 'empty', '변천 자료를 불러오는 중…');
    A.call('race', { n: 20 }).then(r => {
      if (!holder.isConnected) return;
      holder.remove();
      const frames = raceFrames(r); if (!frames.length) return;
      let i = frames.findIndex(f => f.ym === d.date.slice(0, 7)); if (i < 0) i = frames.length - 1;
      // 슬라이더 아래: 상위 20 내 운용사별 M/S 막대 + (v24) 유형별 M/S 막대(유형 순서·색은 다른 탭과 같음)
      const seen = {}; frames.forEach(f => f.rows.forEach(x => { if (x.type) seen[x.type] = 1; }));
      const tk = A.meta.typeOrder.concat(Object.keys(seen).filter(t => A.meta.typeOrder.indexOf(t) < 0));
      A.race(s2, frames, { n: 20, rowH: 28, step: 900, start: i, ms: true, typeMs: Object.keys(seen).length ? { keys: tk, color: tc, note: F3_NOTE } : null });   // v26: 유형 = 유형최종3, 막대 바로 아래 주석(v28: 내부 용어 없이)
    }).catch(e => { holder.className = 'error'; holder.textContent = e.message; });

    // ③ 상위 50 요약 + ④ 목록 (v18: 한 섹션으로 묶고 제목·운용사 칩을 스크롤 고정)

    const chipBox2 = A.div(s3, 'sticky-chips');
    stickyHead(s3);
    A.div(s3, 'sub-h', '운용사별 요약');
    const host3 = A.div(s3, '', A.table(d.byMgr, [
      { h: '운용사', f: r => A.sw(r.top) + r.top, l: 1 }, { h: `상위${N} 내 종목수`, k: 'n' }, { h: 'NAV 합계(조원)', f: r => A.eok(r.nav) }, { h: `상위${N} 내 비중`, f: r => A.share(r.share) }, { h: '시장 전체 대비', f: r => A.share(r.nav / d.total * 100) }
    ], { attr: r => `data-top="${r.top}"`, total: { '운용사': '합계', [`상위${N} 내 종목수`]: N, 'NAV 합계(조원)': A.eok(d.topTotal), [`상위${N} 내 비중`]: '100.0%', '시장 전체 대비': A.share(d.topTotal / d.total * 100) } }));
    A.div(s3, 'sub-h', `종목 목록 (${N}종목)`);
    const host4 = A.div(s3, '', A.table(d.top, [
      { h: '순위', k: 'rank' }, { h: '종목코드', k: 'code', l: 1 }, { h: '종목명', k: 'name', l: 1 }, { h: '운용사', f: r => A.sw(r.top) + r.mgr, l: 1 }, { h: '유형', k: 'type', l: 1 },
      { h: 'NAV(조원)', f: r => A.eok(r.nav) }, { h: '시장 비중', f: r => A.share(r.share) }
    ], { attr: r => `data-top="${r.top}"` }));
    mgrChips(A, chipBox2, { hosts: [host3], filterHosts: [host4], reset: true, hint: '운용사 선택 시 요약 강조·목록은 해당 운용사만 표시' });
  }
});

    A.tiles(root, [['신규상장 종목수', A.num(d.items.length) + '종목', d.year + '년 상장 · ' + (d.filter === 'exBond' ? '채권/금리형 제외' : '전체')], ['신규상장 NAV 합계', A.eok(d.total) + '조원', `기준일 ${dlabel(d.date)}`], ['운용사 수', d.byMgr.length + '사', ''], ['종목당 평균 NAV', d.items.length ? A.eok(d.total / d.items.length) + '조원' : '-', '']]);
    if (!d.items.length) { A.div(root, 'empty', `${d.year}년 상장 종목 없음` + (d.noDate ? ` (상장일 미확정 ${d.noDate}종목 제외)` : '')); return; }
    const s1 = A.section(root, `${d.year}년 신규상장 ETF — 운용사별`, 'NAV 합계(조원) 상위 8개사 + 기타');
    const g = A.div(s1, 'grid grid-2');
    // v19: 막대는 상위 8개사 + '기타 n사' 한 줄로 축약(0.0조 막대 나열 제거), 표와 높이를 맞춤
    const top8 = d.byMgr.slice(0, 8), restB = d.byMgr.slice(8);
    const top = restB.length ? top8.concat([{ mgr: `기타 ${restB.length}사`, top: '기타', nav: restB.reduce((s, r) => s + r.nav, 0) }]) : top8;
    A.bar(A.canvas(g, 'mid'), top.map(r => r.mgr), [{ label: 'NAV 합계', data: top.map(r => r.nav), colors: top.map(r => A.color(r.top)) }], { horizontal: true, noLegend: true, padRight: 40, labels: { mode: 'end', fmt: v => A.eok(v) } });
    // 상위 5개사 + '기타'(접힘, 클릭하면 아래로 펼침) + 합계
    const head5 = d.byMgr.slice(0, 5), rest = d.byMgr.slice(5);
    const etc = rest.length ? { mgr: `기타 ${rest.length}사`, n: rest.reduce((s, r) => s + r.n, 0), nav: rest.reduce((s, r) => s + r.nav, 0), top: '기타', etc: true } : null;
    const rows = head5.concat(etc ? [etc] : []).concat(rest.map(r => Object.assign({ hidden: true }, r)));
    const tb = A.div(g, '', A.table(rows, [{ h: '운용사', f: r => r.etc ? `<span class="fold-btn" aria-expanded="false">▸</span>${r.mgr}` : A.sw(r.top) + r.mgr, l: 1 }, { h: '종목수', k: 'n' }, { h: 'NAV 합계(조원)', f: r => A.eok(r.nav) }, { h: '비중', f: r => d.total ? A.share(r.nav / d.total * 100) : '-' }],
      { attr: r => r.etc ? 'class="fold-head"' : r.hidden ? 'class="fold-item" hidden' : '', total: { '운용사': '합계', '종목수': d.items.length, 'NAV 합계(조원)': A.eok(d.total), '비중': '100.0%' } }));
    const fh = tb.querySelector('.fold-head'); if (fh) fh.onclick = () => { const open = fh.classList.toggle('open'); fh.querySelector('.fold-btn').textContent = open ? '▾' : '▸'; fh.querySelector('.fold-btn').setAttribute('aria-expanded', open); tb.querySelectorAll('.fold-item').forEach(tr => { tr.hidden = !open; }); };
    // v24: 유형별 — 운용사별과 같은 양식(막대 + 표). 주요 4개 유형(국내주식형·해외주식형·채권형·파생형)은 항상, 그 밖의 유형은 해당 종목이 있을 때만
    const sT = A.section(root, `${d.year}년 신규상장 ETF — 유형별`, 'NAV 합계(조원)' + (d.filter === 'exBond' ? ' · 채권/금리형 제외' : ''));
    const byT = {}; d.items.forEach(i => { const k = i.type || '미분류', b = byT[k] = byT[k] || { type: k, n: 0, nav: 0 }; b.n++; b.nav += i.nav; });
    const MAIN = ['국내주식형', '해외주식형', '채권형', '파생형'], tOrd = MAIN.concat(A.meta.typeOrder, Object.keys(byT)).filter((t, i, a) => a.indexOf(t) === i);
    const tRows = tOrd.filter(t => MAIN.indexOf(t) >= 0 || byT[t]).map(t => byT[t] || { type: t, n: 0, nav: 0 });
    const gT = A.div(sT, 'grid grid-2');
    A.bar(A.canvas(gT, 'short'), tRows.map(r => r.type), [{ label: 'NAV 합계', data: tRows.map(r => r.nav), colors: tRows.map(r => tc(r.type)) }], { horizontal: true, noLegend: true, padRight: 40, labels: { mode: 'end', fmt: v => A.eok(v) } });
    A.div(gT, '', A.table(tRows, [{ h: '유형', f: r => A.swc(tc(r.type)) + r.type, l: 1 }, { h: '종목수', k: 'n' }, { h: 'NAV 합계(조원)', f: r => A.eok(r.nav) }, { h: '비중', f: r => d.total ? A.share(r.nav / d.total * 100) : '-' }],
      { tools: false, total: { '유형': '합계', '종목수': d.items.length, 'NAV 합계(조원)': A.eok(d.total), '비중': '100.0%' } }));
    A.div(sT, 'note', F3_NOTE);   // v26
    const s2 = A.section(root, '신규상장 종목 목록', 'NAV 순');
    const chipBox = A.div(s2, 'sticky-chips');
    stickyHead(s2);   // 제목·운용사 선택 칩을 스크롤 시 상단에 고정
    const host = A.div(s2, '', A.table(d.items, [{ h: '상장일', k: 'listDd', l: 1 }, { h: '종목코드', k: 'code', l: 1 }, { h: '종목명', k: 'name', l: 1 }, { h: '운용사', f: r => A.sw(r.top) + r.mgr, l: 1 }, { h: '유형', k: 'type', l: 1 }, { h: '기초자산 구분', k: 'neu', l: 1 }, { h: 'NAV(조원)', f: r => r.listed ? navSmall(A, r.nav) : '-' }], { attr: r => `data-top="${r.top}"` }));
    mgrChips(A, chipBox, { filterHosts: [host], reset: true, hint: '운용사 선택 시 해당 운용사 종목만 표시' });
    if (d.noDate) A.div(s2, 'note', `상장일 미확정 ${d.noDate}종목은 집계에서 제외`);
  }
});

/* 7. 거래대금 */
App.registerTab({
  id: 'turnover', label: '거래대금', controls: ['range'], action: 'turnover', params: s => ({ from: s.from, to: s.to }),
  loadingMsg: '구간 거래대금을 집계하는 중… (처음 조회하는 구간은 최대 10~15초, 이후에는 즉시 표시)',
  prefetch: (s, A) => { const r = A.defaultRange(s); return r.to && r.from ? [['turnover', { from: r.from, to: r.to }]] : []; },   // v24: 탭을 열기 전 기본 구간을 미리 받음
  render(d, root, A) {
    const topSum = d.top.reduce((s, r) => s + r.sum, 0);
    A.tiles(root, [['조회 구간', `${d.from} ~ ${d.to}`, `${d.days}영업일`], ['시장 전체 거래대금', A.jo(d.marketSum) + '원', ''], ['시장 일평균', A.eok(d.marketSum / d.days) + '조원', ''], [`상위 ${d.top.length} 비중`, A.share(topSum / d.marketSum * 100), '시장 거래대금 대비']]);
    const s1 = A.section(root, '거래대금 상위 20 ETF', '구간 합계(조원)');
    const chipBox = A.div(s1);
    const t20 = d.top.slice(0, 20);
    const chart = A.bar(A.canvas(s1, 'tall'), t20.map(r => r.name), [{ label: '거래대금', data: t20.map(r => r.sum), colors: t20.map(r => A.color(r.top)) }], { horizontal: true, noLegend: true, padRight: 40, labels: { mode: 'end', fmt: v => A.eok(v) } });
    const s2 = A.section(root, `거래대금 상위 ${d.top.length}`, '합계 및 일평균 (조원) · 회전율 = 구간 거래대금 ÷ 구간 말일 NAV (배, 높을수록 매매형·낮을수록 보유형)');
    const host = A.div(s2, '', A.table(d.top, [{ h: '순위', k: 'rank' }, { h: '종목코드', k: 'code', l: 1 }, { h: '종목명', k: 'name', l: 1 }, { h: '운용사', f: r => A.sw(r.top) + r.mgr, l: 1 }, { h: '유형', k: 'type', l: 1 },
      { h: '거래대금(조원)', f: r => A.eok(r.sum) }, { h: '일평균(조원)', f: r => A.eok(r.avg) }, { h: '시장 비중', f: r => A.share(r.sum / d.marketSum * 100) },
      { h: 'NAV(조원)', f: r => r.nav ? A.eok(r.nav) : '-' }, { h: '회전율(배)', f: r => r.turn === null || r.turn === undefined ? '-' : A.num(r.turn, 1) }], { attr: r => `data-top="${r.top}"` }));
    mgrChips(A, chipBox, { chart: chart, rowsTop: t20.map(r => r.top), hosts: [host] });
  }
});
</script>
