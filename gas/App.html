<script>
/* ── 코어: 상태·API·컨트롤·탭 레지스트리·차트/표 헬퍼 ───────────────────────── */
const App = {
  meta: null, tabs: [], state: { tab: null, date: null, from: null, to: null, mgr: '', filter: 'exBond', year: null, ref: 'py', focus: false },
  charts: [],
  FOCUS: '한투',   // v19: '우리 회사' 강조 대상(전역 토글) — 설명 문장·카드·차트·표·히트맵 공통
  REF_OPTS: [{ value: 'py', label: '전년말' }, { value: 'pq', label: '전분기말' }, { value: 'pm', label: '전월말' }, { value: 'ly', label: '전년동월' }],

  /* 서버 호출 (로컬 테스트 시 window.MOCK.api 사용). 같은 조회는 세션 내 재요청 없음 */
  _memo: {},
  /** v24: 조회 기억 키 — 파라미터를 키 이름순으로(서버 캐시 키 stableStr_ 와 같은 규칙) → 첫 화면 묶음(boot)으로 받은 자료와 탭 조회가 같은 키 */
  _key(action, params) { const p = params || {}; return action + ':{' + Object.keys(p).sort().filter(k => p[k] !== undefined).map(k => JSON.stringify(k) + ':' + JSON.stringify(p[k])).join(',') + '}'; },
  /** 미리 받은 자료를 조회 기억에 넣음(이후 같은 조회는 서버 호출 없이 즉시) */
  seed(action, params, data) { const k = this._key(action, params); if (!this._memo[k]) this._memo[k] = Promise.resolve(data); },
  call(action, params) {
    const key = this._key(action, params);
    if (this._memo[key]) return this._memo[key];
    const pr = new Promise((res, rej) => {
      const done = raw => { const r = typeof raw === 'string' ? JSON.parse(raw) : raw; r.ok ? res(r.data) : rej(new Error(r.error)); };
      if (typeof google !== 'undefined' && google.script) google.script.run.withSuccessHandler(done).withFailureHandler(e => rej(e)).api(action, params);
      else if (window.API_BASE) fetch(window.API_BASE + '?action=' + encodeURIComponent(action) + '&p=' + encodeURIComponent(JSON.stringify(params || {}))).then(r => { if (!r.ok) throw new Error('서버 응답 오류 (' + r.status + ')'); return r.json(); }).then(done).catch(rej);   // Vercel 등 외부 호스팅
      else if (window.MOCK) setTimeout(() => done(window.MOCK.api(action, params)), 50);
      else rej(new Error('서버 연결 불가'));
    });
    this._memo[key] = pr; pr.catch(() => { delete this._memo[key]; });
    return pr;
  },

  registerTab(t) { this.tabs.push(t); },

  /** v24: 첫 화면 묶음 — meta + 기본 기준일의 탭 기본 조회(서버 캐시에 있는 것). Apps Script 화면은 페이지에 들어 있고(window.BOOT),
   *  없으면 서버에 boot 1건 요청, 그것도 안 되면(이전 서버) meta 만 */
  boot() {
    const B = window.BOOT && (window.BOOT.meta ? window.BOOT : window.BOOT.data);
    if (B && B.meta) return Promise.resolve(B);
    return this.call('boot', {}).then(b => (b && b.meta ? b : Promise.reject(new Error('boot 형식')))).catch(() => this.call('meta', {}).then(m => ({ meta: m, pre: [] })));
  },
  /** v24: 미리 받아 둘 조회 목록 — 각 탭의 기본 조회 + 탭이 화면을 그린 뒤 부르는 조회(prefetch: 히트맵·변천·거래대금). 값이 비어 있는 파라미터는 제외 */
  prefetchList() {
    const s = this.state, out = [];
    this.tabs.forEach(t => {
      if (t.action) out.push([t.action, t.params ? t.params(s) : {}]);
      if (t.prefetch) (t.prefetch(s, this) || []).forEach(x => out.push(x));
    });
    const big = { treemap: 1, race: 1, turnover: 1 };   // 무거운 조회를 먼저(탭을 열기 전에 받아 두는 효과가 큼)
    return out.filter(([, p]) => !Object.keys(p || {}).some(k => p[k] === null || p[k] === undefined)).sort((a, b) => (big[b[0]] || 0) - (big[a[0]] || 0));
  },

  async init() {
    try {
      const b = await this.boot();
      this.meta = b.meta;
      (b.pre || []).forEach(x => this.seed(x[0], x[1], x[2]));
    } catch (e) { document.getElementById('view').innerHTML = `<div class="error">${e.message}</div>`; return; }
    const m = this.meta;
    if (!m.dates.length) { document.getElementById('hdrMeta').textContent = '데이터 적재 전'; document.getElementById('view').innerHTML = '<div class="loading">아직 적재된 데이터가 없습니다. 시트 메뉴 [ETF Dashboard] › 월말 백필 / 일별 백필을 실행하십시오.</div>'; return; }
    this.state.date = m.defaultDate;
    this.state.year = (m.defaultDate || '').slice(0, 4);
    try { this.state.focus = localStorage.getItem('etf.focus') === '1'; } catch (e) {}
    document.body.classList.toggle('focus-on', this.state.focus);
    const ll = this.loadLine(m), hm = document.getElementById('hdrMeta');
    hm.innerHTML = `${ll.head}${ll.at ? ` · 확인 ${ll.at}` : ''}` + (ll.note ? `<br><span class="ld-note${ll.warn ? ' warn' : ''}"></span>` : '');
    if (ll.note) hm.querySelector('.ld-note').textContent = ll.note;
    const nav = document.getElementById('tabs');
    this.tabs.forEach(t => {
      const b = document.createElement('button'); b.className = 'tab'; b.textContent = t.label; b.dataset.id = t.id;
      b.onclick = () => this.show(t.id); nav.appendChild(b);
    });
    const hash = location.hash.replace('#', '');
    this.show(this.tabs.some(t => t.id === hash) ? hash : this.tabs[0].id);
    // 나머지 탭의 조회(히트맵·변천 포함)를 미리 받아 두어 탭 전환이 즉시 되도록 함. 웹(Vercel) 화면은 shell.js 가 한 건씩 차례로 받음
    if (!this.prefetchSeq) setTimeout(() => this.prefetchList().forEach(([a, p]) => this.call(a, p).catch(() => {})), 600);
  },

  /** v17: 적재 상태 — 최종 적재일 + 미게시 사유(예: '09-23(수)분 KRX 미게시 — 추석 연휴(09-24~09-25) 휴장, 09-28(월) 오전 게시 예상') 또는 오류 + 마지막 확인 시각 */
  loadLine(m) {
    const s = m.loadStatus || null;
    const note = s ? (s.error ? '적재 오류: ' + s.error : (s.note || '')) : '';
    return { head: '최종 적재 ' + (m.lastLoaded || '-'), note: note, warn: !!(s && (s.error || s.pending)), at: s && s.at ? s.at.slice(5) : '' };
  },
  show(id) {
    this.state.tab = id; location.hash = id;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.id === id));
    const t = this.tab(); document.body.classList.toggle('narrow-tab', !!(t && t.narrow));   // 개관 등 폭을 제한하는 탭
    this.renderControls(); this.load();
  },

  /* 기준일 선택 목록: 지난 달까지는 '연-월'(월말 스냅샷), 이번 달은 영업일 전체 */
  dateOptions() {
    const m = this.meta, cur = m.curMonth;
    const out = [];
    m.months.filter(x => x.ym < cur).forEach(x => out.push({ value: x.date, label: x.ym }));
    m.dates.filter(d => d.slice(0, 7) === cur).forEach(d => out.push({ value: d, label: d }));
    return out;
  },

  /** 거래대금 기본 구간: To = 기준일(일별 자료가 있으면, 없으면 최근 영업일), From = 그해 첫 영업일 (v24: 미리 받기에서도 같은 구간을 쓰도록 분리) */
  defaultRange(s) {
    const m = this.meta, dv = m.dates.filter(d => d >= m.dailyFrom);
    const to = s.to || (dv.includes(s.date) ? s.date : dv[dv.length - 1]);
    if (!to) return { from: null, to: null };
    const py = m.months.filter(x => x.ym < to.slice(0, 4) + '-01').pop();
    return { from: s.from || (py && dv.some(d => d > py.date) ? dv.find(d => d > py.date) : dv[0]), to: to };
  },

  /* 컨트롤 바: 탭이 선언한 컨트롤만 표시 */
  renderControls() {
    const t = this.tab(), el = document.getElementById('controls'), s = this.state, m = this.meta;
    el.innerHTML = '';
    const sel = (label, key, options, onChange) => {
      const w = document.createElement('div'); w.className = 'ctl';
      w.innerHTML = `<label>${label}</label><select></select>`;
      const se = w.querySelector('select');
      options.slice().reverse().forEach(o => { const op = document.createElement('option'); op.value = o.value; op.textContent = o.label; se.appendChild(op); });
      const vals = options.map(o => o.value);
      se.value = s[key] && vals.includes(s[key]) ? s[key] : vals[vals.length - 1];
      s[key] = se.value;
      se.onchange = () => { s[key] = se.value; if (onChange) onChange(se.value); this.load(); };
      el.appendChild(w);
    };
    (t.controls || []).forEach(c => {
      if (c === 'date') sel('기준일자', 'date', this.dateOptions(), v => { s.year = v.slice(0, 4); });
      if (c === 'range') {
        const daily = m.dates.filter(d => d >= m.dailyFrom).map(d => ({ value: d, label: d }));
        if (!s.to || !s.from) { const r = this.defaultRange(s); if (!s.to) s.to = r.to; if (!s.from) s.from = r.from; }
        sel('From', 'from', daily); sel('To', 'to', daily);
      }
      if (c === 'year') {
        const years = [...new Set(m.months.map(x => x.ym.slice(0, 4)))].map(y => ({ value: y, label: y + '년' }));
        sel('상장 연도', 'year', years, y => { const opts = this.dateOptions().filter(o => o.value.slice(0, 4) === y); if (opts.length && s.date.slice(0, 4) !== y) s.date = opts[opts.length - 1].value; this.renderControls(); });
      }
      if (c === 'mgr') {
        const w = document.createElement('div'); w.className = 'ctl'; w.innerHTML = `<label>개별 운용사</label><select><option value="">선택…</option></select>`;
        const se = w.querySelector('select'); m.mgrs.forEach(x => { const o = document.createElement('option'); o.value = x; o.textContent = x; se.appendChild(o); });
        se.value = s.mgr; se.onchange = () => { s.mgr = se.value; this.load(); }; el.appendChild(w);
      }
      if (c === 'filter') {
        const w = document.createElement('div'); w.className = 'ctl'; w.innerHTML = `<label>ETF 유형</label><div class="seg"><button data-v="exBond">채권/금리형 제외</button><button data-v="all">전체</button></div>`;
        w.querySelectorAll('button').forEach(b => { b.classList.toggle('on', b.dataset.v === s.filter); b.onclick = () => { s.filter = b.dataset.v; this.renderControls(); this.load(); }; });
        el.appendChild(w);
      }
      if (c === 'ref') {   // v19: 비교 기준(전년말·전분기말·전월말·전년동월)
        const w = document.createElement('div'); w.className = 'ctl'; w.innerHTML = `<label>비교 기준</label><select></select>`;
        const se = w.querySelector('select'); this.REF_OPTS.forEach(o => { const op = document.createElement('option'); op.value = o.value; op.textContent = o.label; se.appendChild(op); });
        se.value = s.ref || 'py'; se.title = '증감·M/S 변동의 비교 시점'; se.onchange = () => { s.ref = se.value; this.load(); }; el.appendChild(w);
      }
    });
    // v19: 전역 'ACE 강조' 토글 — 모든 탭 공통. 켜면 한투 계열만 본색, 나머지 차트·표·히트맵은 흐리게
    const fw = document.createElement('div'); fw.className = 'ctl ctl-focus';
    fw.innerHTML = `<button class="seg-one${s.focus ? ' on' : ''}" title="한투(ACE) 상품·운용사만 강조하고 나머지는 흐리게 표시">${this.sw(this.FOCUS)}ACE 강조</button>`;
    fw.querySelector('button').onclick = () => { s.focus = !s.focus; try { localStorage.setItem('etf.focus', s.focus ? '1' : '0'); } catch (e) {} document.body.classList.toggle('focus-on', s.focus); this.renderControls(); this.load(); };
    el.appendChild(fw);
  },
  /** v19: 강조 모드에서 색을 흐리게(한투 계열은 그대로). 운용사 고유색·기타색 외의 색(유형색 등)은 건드리지 않음 */
  focusColor(col, top) {
    if (!this.state.focus) return col;
    const isF = top ? top === this.FOCUS : (String(col).toLowerCase() === String(this.color(this.FOCUS)).toLowerCase());
    return isF ? col : this.fade(col, 0.22);
  },
  refLabel(d) { return (d && d.refLabel) || '전년말'; },

  tab() { return this.tabs.find(t => t.id === this.state.tab); },
  /* 탭 전환 시 정리할 작업 등록(타이머 등) */
  onUnload(fn) { (this._unload = this._unload || []).push(fn); },

  async load() {
    const t = this.tab(), view = document.getElementById('view');
    (this._unload || []).forEach(f => { try { f(); } catch (e) {} }); this._unload = [];
    this.charts.forEach(c => c.destroy()); this.charts = [];
    view.innerHTML = `<div class="loading">${t.loadingMsg || '데이터를 불러오는 중…'}</div>`;
    const token = this._req = (this._req || 0) + 1;
    try {
      const data = t.load ? await t.load(this.state, this) : await this.call(t.action, t.params ? t.params(this.state) : {});
      if (token !== this._req) return;                 // 더 최근 요청이 있으면 무시
      view.innerHTML = ''; t.render(data, view, this);
    } catch (e) { if (token === this._req) view.innerHTML = `<div class="error">${e.message}</div>`; }
  },

  /* ── 포맷 ── 금액 단위는 조원(소수 둘째자리에서 반올림, 첫째자리 표기)으로 통일 */
  eok(v, d) { if (v === null || v === undefined || isNaN(v)) return '-'; const f = d === undefined ? 1 : d; let x = v / 1e12; if (Math.abs(x) < Math.pow(10, -f) / 2) x = 0; return x.toLocaleString('ko-KR', { maximumFractionDigits: f, minimumFractionDigits: f }); },
  jo(v, d) { return v === null || v === undefined ? '-' : this.eok(v, d) + '조'; },
  pct(v, d) { if (v === null || v === undefined || isNaN(v)) return '-'; const f = d === undefined ? 1 : d; if (Math.abs(v) < Math.pow(10, -f) / 2) v = 0; return (v > 0 ? '+' : '') + v.toFixed(f) + '%'; },
  share(v, d) { return v === null || v === undefined || isNaN(v) ? '-' : v.toFixed(d === undefined ? 1 : d) + '%'; },
  num(v, d) { return v === null || v === undefined ? '-' : (+v).toLocaleString('ko-KR', { maximumFractionDigits: d || 0, minimumFractionDigits: d || 0 }); },
  signed(v, d) { if (v === null || v === undefined) return '-'; const t = this.eok(v, d); return (v > 0 && !/^-?0\.?0*$/.test(t) ? '+' : '') + t; },
  cls(v) { return v < -5e10 ? 'neg' : ''; },          // 금액(원): 0.1조 미만 음수는 0.0 으로 표기되므로 색 없음
  clsP(v) { return v < -0.05 ? 'neg' : ''; },         // 비율(%)
  color(top) { return this.meta.colors[top] || this.meta.colors['기타']; },
  BOND_GRAY: '#c4c4cc',   // bar chart race 채권/금리형 막대색 (기타 회색보다 옅게)
  sw(top) { return `<span class="sw" style="background:${this.color(top)}"></span>`; },
  swc(color) { return `<span class="sw" style="background:${color}"></span>`; },

  /* ── 표 ── cols: [{h, k|f, l(left), cls, g(그룹명)}]  opts: {total, attr(r)→행 속성 문자열} */
  table(rows, cols, opts) {
    opts = opts || {};
    const hasG = cols.some(c => c.g);
    // v19: 8행 이상 표에는 도구 줄(검색·CSV) + 머리글 클릭 정렬. 표 HTML 을 삽입한 뒤 A.tableTools(host) 를 호출하면 활성화(div() 가 자동 호출)
    const tools = opts.tools !== false && rows.length >= 8;
    let h = (tools ? `<div class="tbl-tools"><input type="search" class="tbl-q" placeholder="검색 (종목·운용사·유형)" aria-label="표 검색"><span class="tbl-cnt"></span><button type="button" class="tbl-csv" title="현재 표를 CSV 파일로 내려받기">CSV</button></div>` : '')
      + `<div class="tbl-scroll${opts.compact ? ' compact' : ''}"><table class="tbl${opts.compact ? ' compact' : ''}${tools ? ' sortable' : ''}"><thead>`;   // v24: compact = 내용 폭(옆으로 퍼지지 않음)
    if (hasG) {   // 1단: 그룹 헤더(연초 대비 / 전월 대비 …), 2단: 항목
      h += '<tr class="grp-row">';
      for (let i = 0; i < cols.length;) { const g = cols[i].g || ''; let j = i; while (j < cols.length && (cols[j].g || '') === g) j++; h += `<th colspan="${j - i}" class="${g ? 'grp' : 'nog'}">${g}</th>`; i = j; }
      h += '</tr>';
    }
    const gcls = i => { const g = cols[i].g || ''; if (!g) return ''; const first = i === 0 || (cols[i - 1].g || '') !== g, last = i === cols.length - 1 || (cols[i + 1].g || '') !== g; return (first ? ' g-start' : '') + (last ? ' g-end' : '') + ' g-in'; };
    h += '<tr>' + cols.map((c, i) => `<th class="${c.l ? 'l' : ''}${gcls(i)}"${tools ? ' data-sort="' + i + '" title="클릭하여 정렬"' : ''}>${c.h}</th>`).join('') + '</tr></thead><tbody>';
    rows.forEach(r => { h += `<tr ${opts.attr ? opts.attr(r) : ''}>` + cols.map((c, i) => { const v = c.f ? c.f(r) : r[c.k]; return `<td class="${c.l ? 'l' : ''} ${c.cls ? c.cls(r) : ''}${gcls(i)}">${v === undefined || v === null ? '-' : v}</td>`; }).join('') + '</tr>'; });
    if (opts.total) h += '<tr class="total">' + cols.map((c, i) => { const key = c.g && opts.total[c.g + '|' + c.h] !== undefined ? c.g + '|' + c.h : c.h; return `<td class="${c.l ? 'l' : ''}${gcls(i)}">${opts.total[key] !== undefined ? opts.total[key] : ''}</td>`; }).join('') + '</tr>';
    return h + '</tbody></table></div>';
  },

  /* ── 운용사 선택 칩: 클릭 시 onSelect(top|null). 표시 = 고유색 견본 + 운용사명 (범례 겸용) ── */
  chips(parent, keys, opts) {
    opts = opts || {};
    const w = document.createElement('div'); w.className = 'chips';
    if (opts.hint) { const hn = document.createElement('span'); hn.className = 'chips-hint'; hn.textContent = opts.hint; w.appendChild(hn); }
    let sel = opts.selected || null;
    const render = () => { w.querySelectorAll('.chip-m').forEach(b => { if (b.dataset.k === '') { b.classList.toggle('on', !sel); return; } b.classList.toggle('on', b.dataset.k === sel); b.classList.toggle('off', !!sel && b.dataset.k !== sel); }); };
    if (opts.reset) { const b = document.createElement('button'); b.className = 'chip-m reset'; b.dataset.k = ''; b.textContent = opts.reset === true ? '초기화' : opts.reset; b.onclick = () => { sel = null; render(); if (opts.onSelect) opts.onSelect(null); }; w.appendChild(b); }
    keys.forEach(k => {
      const b = document.createElement('button'); b.className = 'chip-m'; b.dataset.k = k;
      b.innerHTML = `<span class="sw" style="background:${opts.colorFn ? opts.colorFn(k) : this.color(k)}"></span>${opts.labelFn ? opts.labelFn(k) : k}`;
      b.onclick = () => { sel = sel === k ? null : k; render(); if (opts.onSelect) opts.onSelect(sel); };
      w.appendChild(b);
    });
    render(); parent.appendChild(w);
    return { el: w, get: () => sel };
  },
  /* 표 행 강조: attr 로 data-top 을 넣은 행 중 pred 에 맞는 행을 강조, 나머지는 흐리게 */
  highlightRows(container, sel) {
    container.querySelectorAll('tr[data-top]').forEach(tr => { tr.classList.toggle('hl', !!sel && tr.dataset.top === sel); tr.classList.toggle('dim', !!sel && tr.dataset.top !== sel); });
  },

    const stage = box.querySelector('.race-stage'), ym = box.querySelector('.race-ym'), range = box.querySelector('.race-range'), btn = box.querySelector('.race-play');
    box.querySelectorAll('.race-ms-bar').forEach((el, i) => { bars[i].el = el; bars[i].seg = {}; });
    const inkOn = hex => { const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); const L = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; return (L + 0.05) / 0.05 > 1.05 / (L + 0.05) ? '#17171c' : '#fff'; };
    const mctx = document.createElement('canvas').getContext('2d');   // 칸 글자 폭 측정용
    const fits = (el, txt, w) => { mctx.font = getComputedStyle(el).font || '12px sans-serif'; return mctx.measureText(txt).width + 14 <= w; };
    const drawMs = (rows, instant) => bars.forEach(b => {
      const tot = rows.reduce((a, r) => a + r.nav, 0) || 1, bw = b.el.clientWidth || 600;
      b.keys.forEach(k => {
        const xs = rows.filter(r => b.of(r) === k), nav = xs.reduce((a, r) => a + r.nav, 0), pct = nav / tot * 100, w = bw * pct / 100;
        let el = b.seg[k];
        if (!el) { el = document.createElement('div'); el.className = 'race-ms-seg'; const col = b.color(k); el.style.background = col; el.style.color = inkOn(col); b.el.appendChild(el); b.seg[k] = el; }
        el.style.transition = instant ? 'none' : `flex-grow ${dur * 0.85}ms cubic-bezier(.4,0,.2,1)`;
        el.style.display = nav > 0 ? '' : 'none';
        el.style.flexGrow = String(pct);
        const full = `${k} ${pct.toFixed(1)}%`, short = pct.toFixed(0) + '%';
        el.textContent = fits(el, full, w) ? full : fits(el, short, w) ? short : '';   // 칸 폭에 맞춰 이름·비율 / 비율만 / 생략
        el.title = `${k} · 상위 ${N} 내 ${xs.length}종목 · NAV ${App.eok(nav)}조원 · M/S ${pct.toFixed(1)}%`;
      });
    });
    const nodes = {};
    const maxNav = Math.max.apply(null, frames.map(f => Math.max.apply(null, f.rows.map(r => r.nav))));
    let timer = null, cur = 0;
    const draw = (k, instant) => {
      const f = frames[k]; ym.textContent = f.ym; range.value = k;
      drawMs(f.rows.slice(0, N), instant);
      const fmax = Math.max.apply(null, f.rows.map(r => r.nav)) || 1;   // 프레임별 최대값 기준 폭 (초기 소규모도 보이게)
      const present = {};
      f.rows.slice(0, N).forEach(r => {
        present[r.code] = true;
        let el = nodes[r.code];
        if (!el) {   // 신규 진입: 화면 아래에서 올라옴
          el = document.createElement('div'); el.className = 'race-row'; el.innerHTML = `<div class="race-rank"></div><div class="race-track"><div class="race-fill"></div><div class="race-name"></div></div><div class="race-val"></div>`;
          el.style.height = H + 'px'; el.style.transform = `translateY(${N * H + 40}px)`; el.style.opacity = '0'; stage.appendChild(el); nodes[r.code] = el;
          if (!instant) void el.offsetHeight;   // 트랜지션 적용을 위한 reflow
        }
        el.style.transition = instant ? 'none' : `transform ${dur * 0.85}ms cubic-bezier(.4,0,.2,1), opacity ${dur * 0.5}ms`;
        el.querySelector('.race-fill').style.transition = instant ? 'none' : `width ${dur * 0.85}ms cubic-bezier(.4,0,.2,1)`;
        el.style.transform = `translateY(${(r.rank - 1) * H}px)`; el.style.opacity = '1';
        el.querySelector('.race-rank').textContent = r.rank;
        el.querySelector('.race-fill').style.width = (r.nav / fmax * 100) + '%';
        el.querySelector('.race-fill').style.background = App.focusColor(r.bond ? App.BOND_GRAY : App.color(r.top), r.top);   // 채권/금리형은 회색
        el.querySelector('.race-name').textContent = r.name; const nm = el.querySelector('.race-name'); nm.style.color = r.bond ? '#3a3a44' : ''; nm.style.textShadow = r.bond ? 'none' : '';
        el.querySelector('.race-val').textContent = App.eok(r.nav) + '조';
      });
      Object.keys(nodes).forEach(c => { if (!present[c]) { const el = nodes[c]; el.style.transition = instant ? 'none' : `transform ${dur * 0.85}ms, opacity ${dur * 0.5}ms`; el.style.transform = `translateY(${N * H + 40}px)`; el.style.opacity = '0'; setTimeout(() => { if (nodes[c] === el && !el.style.opacity.startsWith('1')) { el.remove(); delete nodes[c]; } }, dur); } });
      cur = k;
    };
    const stop = () => { clearInterval(timer); timer = null; btn.textContent = '▶ 재생'; };
    btn.onclick = () => { if (timer) return stop(); btn.textContent = '❚❚ 정지'; if (cur >= frames.length - 1) draw(0, true); timer = setInterval(() => { if (cur + 1 >= frames.length) return stop(); draw(cur + 1); }, dur); };
    range.oninput = () => { stop(); draw(+range.value, true); };
    draw(Math.max(0, Math.min(frames.length - 1, opts.start === undefined ? frames.length - 1 : opts.start)), true);
    this.onUnload(stop);
    return { draw: draw, stop: stop };
  },

  section(parent, title, note) {
    const s = document.createElement('div'); s.className = 'section';
    s.innerHTML = `<div class="section-h"><h2 class="h2">${title}</h2>${note ? `<span class="note">${note}</span>` : ''}</div>`;
    parent.appendChild(s); return s;
  },
  sub(parent, title) { const d = document.createElement('div'); d.className = 'h3'; d.textContent = title; parent.appendChild(d); return d; },
  div(parent, cls, html) { const d = document.createElement('div'); if (cls) d.className = cls; if (html) { d.innerHTML = html; if (d.querySelector('.tbl-tools')) this.tableTools(d); } parent.appendChild(d); return d; },
  /** v19: 표 도구 — 머리글 클릭 정렬(숫자·문자 자동 판별, 합계 행은 항상 맨 아래), 검색(행 텍스트 부분 일치), CSV 내려받기(현재 보이는 행) */
  tableTools(host) {
    const tb = host.querySelector('table.tbl'), body = tb && tb.tBodies[0]; if (!tb || !body) return;
    const q = host.querySelector('.tbl-q'), cnt = host.querySelector('.tbl-cnt'), csv = host.querySelector('.tbl-csv');
    const dataRows = () => [...body.rows].filter(r => !r.classList.contains('total'));
    const num = t => { const x = String(t).replace(/[,%조원배\s]/g, '').replace(/p$/, ''); return x !== '' && !isNaN(x) ? +x : null; };
    const state = { col: -1, dir: 1 };
    tb.querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => {
      const i = +th.dataset.sort; state.dir = state.col === i ? -state.dir : (th.classList.contains('l') ? 1 : -1); state.col = i;
      tb.querySelectorAll('th[data-sort]').forEach(x => x.classList.remove('asc', 'desc')); th.classList.add(state.dir > 0 ? 'asc' : 'desc');
      const rows = dataRows(), total = body.querySelector('tr.total');
      rows.sort((a, b) => { const ta = a.cells[i] ? a.cells[i].textContent.trim() : '', tbb = b.cells[i] ? b.cells[i].textContent.trim() : ''; const na = num(ta), nb = num(tbb); const r = na !== null && nb !== null ? na - nb : ta.localeCompare(tbb, 'ko'); return r * state.dir; });
      rows.forEach(r => body.appendChild(r)); if (total) body.appendChild(total);
    });
    if (q) q.oninput = () => { const s = q.value.trim().toLowerCase(); let n = 0; dataRows().forEach(r => { const hit = !s || r.textContent.toLowerCase().indexOf(s) >= 0; r.classList.toggle('q-hide', !hit); if (hit) n++; }); cnt.textContent = s ? `${n}행` : ''; };
    if (csv) csv.onclick = () => {
      const head = [...tb.tHead.rows[tb.tHead.rows.length - 1].cells].map(c => c.textContent.trim());
      const lines = [head].concat([...body.rows].filter(r => !r.classList.contains('q-hide') && !r.classList.contains('fold') && !r.hidden).map(r => [...r.cells].map(c => c.textContent.trim())));
      const text = '\ufeff' + lines.map(l => l.map(v => /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v).join(',')).join('\r\n');
      const name = ((this.tab() || {}).label || 'table') + '_' + (this.state.date || '') + '.csv';
      try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
      catch (e) { window.open('data:text/csv;charset=utf-8,' + encodeURIComponent(text)); }
    };
  },
  /** v24: 항목·내용 2열 요약표(머리글 없음). rows: [[항목, 내용 HTML], ...] */
  kv(parent, rows) { return this.div(parent, 'kv-wrap', '<table class="kv"><tbody>' + rows.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('') + '</tbody></table>'); },
  tiles(parent, items) { const t = this.div(parent, 'grid grid-' + Math.min(items.length, 4)); t.innerHTML = items.map(x => `<div class="tile"><div class="k">${x[0]}</div><div class="v">${x[1]}</div><div class="d">${x[2] || ''}</div></div>`).join(''); return t; }
};
window.addEventListener('DOMContentLoaded', () => App.init());
</script>
